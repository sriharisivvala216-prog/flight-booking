# ========================================================
# Render Infrastructure as Code Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ========================================================
services:
  - type: web
    name: skywings-flightbooking-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://flight-booking-frontend-id1-djybh9uvl-sivvala.vercel.app
